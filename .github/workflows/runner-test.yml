name: Minimal Runner Test

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: RUNNER_OK
        run: |
          echo "RUNNER_OK"
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Runner arch: ${RUNNER_ARCH:-unknown}"

      - name: Tooling check
        run: |
          set -euo pipefail
          command -v git
          command -v gh
          command -v curl
          command -v jq || sudo apt-get update && sudo apt-get install -y jq
          git --version
          gh --version
          echo "TOOLING_OK"

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Branch, write diagnostic file, commit, push, open PR
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Personal-AI-Bot"
          git config user.email "bot@users.noreply.github.com"

          STAMP=$(date -u +%Y%m%d%H%M%S)
          BRANCH="agent/diag-${STAMP}"
          git checkout -b "$BRANCH"

          mkdir -p diagnostics
          cat > diagnostics/RUNNER_DIAGNOSTIC.md << EOF
          # Runner diagnostic

          Generated by Minimal Runner Test at $(date -u -Iseconds).
          This file confirms hosted-runner execution, git write, and PR path.
          Safe to delete after verification.
          EOF

          git add diagnostics/RUNNER_DIAGNOSTIC.md
          git commit -m "diag: runner pipeline smoke ${STAMP}"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "[diag] Runner pipeline smoke ${STAMP}" \
            --body "Automated diagnostic from Minimal Runner Test. Safe to close/delete." \
            || true)

          if [ -z "${PR_URL:-}" ]; then
            PR_URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' || true)
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL:-}" >> "$GITHUB_OUTPUT"
          echo "PIPELINE_DIAG_OK branch=$BRANCH commit=$(git rev-parse HEAD) pr=${PR_URL:-none}"

      - name: Summary
        run: |
          echo "=== Diagnostic complete ==="
          echo "Branch: ${{ steps.diag.outputs.branch }}"
          echo "Commit: ${{ steps.diag.outputs.commit }}"
          echo "PR: ${{ steps.diag.outputs.pr_url }}"
