name: Personal AI Agent

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID from control plane
        required: true
        type: string
      target_repo:
        description: owner/repo to work on
        required: true
        type: string
      target_branch:
        description: Base branch
        required: false
        default: main
        type: string
      prompt:
        description: Natural language coding instruction
        required: true
        type: string
      callback_url:
        description: Full URL to PATCH task status
        required: true
        type: string
      callback_token:
        description: Per-task callback credential
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate inputs
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          echo "RUNNER_OK"
          [[ "$TARGET_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || { echo "Invalid repository format"; exit 1; }
          [[ "$TASK_ID" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "Invalid task_id"; exit 1; }
          [[ -n "$TASK_PROMPT" ]] || { echo "prompt required"; exit 1; }

      - name: Report RUNNING
        env:
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        run: |
          set -uo pipefail
          URL="$CALLBACK_URL"
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then
            if [[ "$URL" == *\?* ]]; then
              URL="${URL}&x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"
            else
              URL="${URL}?x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"
            fi
          fi
          ARGS=(-H "Content-Type: application/json" -H "x-worker-token: ${CALLBACK_TOKEN}")
          if [ -n "${WORKER_CALLBACK_SECRET:-}" ]; then
            ARGS+=(-H "x-worker-secret: ${WORKER_CALLBACK_SECRET}")
          fi
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then
            ARGS+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}")
          fi
          HTTP=$(curl -sS -o /tmp/cb.txt -w "%{http_code}" -X PATCH "$URL" "${ARGS[@]}" \
            -d "{\"status\":\"RUNNING\",\"workerRunId\":\"${{ github.run_id }}\",\"heartbeatAt\":\"$(date -u -Iseconds)\"}" || echo "000")
          echo "callback_http=$HTTP"
          head -c 400 /tmp/cb.txt || true
          echo

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          path: workspace
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --quiet aider-chat
          aider --version

      - name: Load acceptance verifier
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/contents/.github/scripts/task-acceptance-gate.py?ref=${{ github.sha }}" --jq '.content' | base64 --decode > /tmp/task-acceptance-gate.py
          test -s /tmp/task-acceptance-gate.py

      - name: Execute agent
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
          TASK_PROMPT: ${{ inputs.prompt }}
          TASK_ID: ${{ inputs.task_id }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        working-directory: workspace
        run: |
          set -euo pipefail
          git config user.name "Personal-AI-Bot"
          git config user.email "bot@users.noreply.github.com"

          if [ ! -f .gitignore ] || ! grep -q 'node_modules/' .gitignore 2>/dev/null; then
            printf '\nnode_modules/\n.next/\ndist/\nbuild/\n.aider*\n.env\n.env.*\n' >> .gitignore
          fi

          BRANCH="agent/${TASK_ID}"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "LLM_API_KEY is missing"
            exit 1
          fi

          MODEL="gemini/gemini-3.6-flash"
          echo "Using model $MODEL"

          BASELINE_SHA="$(git rev-parse HEAD)"
          printf '%s' "$TASK_PROMPT" | aider --yes --no-git --model "$MODEL" --message-file /dev/stdin

          acceptance_attempt=1
          acceptance_max_attempts=3
          acceptance_passed=0
          while [ "$acceptance_attempt" -le "$acceptance_max_attempts" ]; do
            echo "=== Acceptance-criteria attempt $acceptance_attempt ==="
            set +e
            ACCEPTANCE_OUTPUT="$(python /tmp/task-acceptance-gate.py "$TASK_PROMPT" "$BASELINE_SHA" 2>&1)"
            acceptance_rc=$?
            set -e
            echo "$ACCEPTANCE_OUTPUT"

            if [ "$acceptance_rc" -eq 0 ]; then
              acceptance_passed=1
              break
            fi

            if [ "$acceptance_attempt" -lt "$acceptance_max_attempts" ]; then
              echo "Acceptance gate failed; requesting remediation"
              ACCEPTANCE_CONTEXT="$(printf '%s\n' "$ACCEPTANCE_OUTPUT" | tail -n 120 | head -c 12000)"
              REMEDIATION_PROMPT="The implementation FAILED the task-output acceptance gate.

Original task:
$TASK_PROMPT

Acceptance-gate evidence:
$ACCEPTANCE_CONTEXT

Implement the ORIGINAL task materially. Do not only change .gitignore, lockfiles, or generated files."
              printf '%s' "$REMEDIATION_PROMPT" | aider --yes --no-git --model "$MODEL" --message-file /dev/stdin
            fi
            acceptance_attempt=$((acceptance_attempt + 1))
          done

          if [ "$acceptance_passed" -ne 1 ]; then
            echo "Acceptance criteria gate failed after $acceptance_max_attempts attempts"
            exit 1
          fi

          attempt=1
          max_attempts=3
          verified=0
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "=== Verification attempt $attempt ==="
            set +e
            rc=0
            if [ -f package.json ]; then
              if [ -f package-lock.json ]; then
                npm ci --no-audit --no-fund || rc=$?
              else
                npm install --no-audit --no-fund || rc=$?
              fi
              if [ "$rc" -eq 0 ]; then
                if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
                  npm test --if-present || rc=$?
                fi
              fi
              if [ "$rc" -eq 0 ]; then
                if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
                  npm run build --if-present || rc=$?
                fi
              fi
            else
              echo "No package.json — skipping node verification"
              rc=0
            fi
            set -e

            if [ "$rc" -eq 0 ]; then
              verified=1
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Verification failed; requesting repair"
              printf '%s\n' "The verification failed. Fix the repository so install/test/build pass. Preserve the original task." | aider --yes --no-git --model "$MODEL" --message-file /dev/stdin || true
            fi
            attempt=$((attempt + 1))
          done

          if [ "$verified" -ne 1 ]; then
            echo "Verification failed after $max_attempts attempts"
            exit 1
          fi

          rm -rf node_modules .next dist build .aider* 2>/dev/null || true
          git add -A
          git reset HEAD -- node_modules .next dist build .aider* 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git commit -m "agent(${TASK_ID}): automated changes"
          git push -u origin "$BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: pr
        if: steps.agent.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          TASK_ID: ${{ inputs.task_id }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        working-directory: workspace
        run: |
          set -euo pipefail
          BRANCH="agent/${TASK_ID}"
          set +e
          OUT=$(gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "[Personal AI Bot] ${TASK_ID}" \
            --body "## Automated coding task

**Task ID:** \"${TASK_ID}\"

**Acceptance:** PASS
**Verification:** PASS

Generated by Personal AI Agent workflow." 2>&1)
          EC=$?
          set -e
          echo "$OUT"
          PR_URL=""
          if [ "$EC" -eq 0 ]; then
            PR_URL=$(echo "$OUT" | grep -Eo 'https://github.com/[^ ]+' | tail -n1 || true)
          fi
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' 2>/dev/null || true)
          fi
          echo "pull-request-url=$PR_URL" >> "$GITHUB_OUTPUT"
          if [ -z "$PR_URL" ]; then
            echo "PR not created. Enable Actions permission to create PRs or set AGENT_GITHUB_TOKEN."
            exit 1
          fi

      - name: Report final status
        if: always()
        env:
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        run: |
          set -uo pipefail
          STATUS="FAILED"
          if [ "${{ job.status }}" = "success" ]; then
            if [ -n "${{ steps.pr.outputs.pull-request-url }}" ]; then
              STATUS="PR_CREATED"
            else
              STATUS="COMPLETED"
            fi
          fi
          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg run "${{ github.run_id }}" \
            --arg commit "${{ steps.agent.outputs.commit }}" \
            --arg pr "${{ steps.pr.outputs.pull-request-url }}" \
            '{status:$status,workerRunId:$run,commitSha:$commit,prUrl:$pr}')
          URL="$CALLBACK_URL"
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then
            if [[ "$URL" == *\?* ]]; then
              URL="${URL}&x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"
            else
              URL="${URL}?x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"
            fi
          fi
          ARGS=(-H "Content-Type: application/json" -H "x-worker-token: ${CALLBACK_TOKEN}")
          if [ -n "${WORKER_CALLBACK_SECRET:-}" ]; then
            ARGS+=(-H "x-worker-secret: ${WORKER_CALLBACK_SECRET}")
          fi
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then
            ARGS+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}")
          fi
          HTTP=$(curl -sS -o /tmp/final.txt -w "%{http_code}" -X PATCH "$URL" "${ARGS[@]}" -d "$PAYLOAD" || echo "000")
          echo "final_callback_http=$HTTP"
          head -c 300 /tmp/final.txt || true
          echo

      - name: Cleanup
        if: always()
        run: rm -rf workspace || true
