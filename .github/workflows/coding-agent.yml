name: Coding Agent Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID from control plane'
        required: true
      target_repo:
        description: 'owner/repo to work on'
        required: true
      target_branch:
        description: 'Base branch'
        required: false
        default: 'main'
      prompt:
        description: 'Natural language coding instruction'
        required: true
      callback_url:
        description: 'Optional webhook to report result'
        required: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: workspace
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent tooling
        run: |
          pip install --quiet aider-chat
          # Future upgrade path: openhands-sdk or cline CLI when free-minute friendly

      - name: Execute agent loop (safe placeholder + real aider path)
        id: agent
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          AIDER_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        working-directory: workspace
        run: |
          set -euo pipefail
          echo "=== Personal AI Bot task ${{ github.event.inputs.task_id }} ==="
          echo "Prompt: ${{ github.event.inputs.prompt }}"

          # Create a branch for the work
          git config user.name "Personal-AI-Bot"
          git config user.email "bot@users.noreply.github.com"
          BRANCH="agent/${{ github.event.inputs.task_id }}"
          git checkout -b "$BRANCH"

          # Real agent invocation (aider). Falls back gracefully if key missing.
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            aider --yes --no-git --message "${{ github.event.inputs.prompt }}" || echo "Aider finished with non-zero (continuing)"
          else
            echo "No LLM_API_KEY — writing a minimal safe change for pipeline test"
            echo "# Agent placeholder run $(date -u -Iseconds)" >> AGENT_PLACEHOLDER.md
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "agent(${{ github.event.inputs.task_id }}): automated changes"
            git push -u origin "$BRANCH"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.agent.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: workspace
          branch: agent/${{ github.event.inputs.task_id }}
          base: ${{ github.event.inputs.target_branch }}
          title: "[Personal AI Bot] ${{ github.event.inputs.task_id }}"
          body: |
            ## Automated coding task

            **Prompt**
            ${{ github.event.inputs.prompt }}

            **Task ID:** `${{ github.event.inputs.task_id }}`

            Generated by the Personal AI Bot control plane. Review carefully before merging.
          draft: false

      - name: Callback (optional)
        if: always()
        run: |
          if [ -n "${{ github.event.inputs.callback_url }}" ]; then
            curl -sS -X POST "${{ github.event.inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -d '{"task_id":"${{ github.event.inputs.task_id }}","status":"${{ job.status }}","run_id":"${{ github.run_id }}","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true
          fi
