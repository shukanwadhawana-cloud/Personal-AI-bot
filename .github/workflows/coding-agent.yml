name: Coding Agent Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID from control plane
        required: true
        type: string
      target_repo:
        description: owner/repo to work on
        required: true
        type: string
      target_branch:
        description: Base branch
        required: false
        default: main
        type: string
      prompt:
        description: Natural language coding instruction
        required: true
        type: string
      callback_url:
        description: Full URL to PATCH (e.g. https://app/api/tasks/id)
        required: false
        type: string
      callback_token:
        description: Per-task callback credential
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run-agent:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate inputs and runner
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OK"
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          if [[ ! "${{ github.event.inputs.target_repo }}" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "Invalid repository format"
            exit 1
          fi
          if [[ -z "${{ github.event.inputs.task_id }}" || ! "${{ github.event.inputs.task_id }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid task_id"
            exit 1
          fi
          if [[ -z "${{ github.event.inputs.prompt }}" ]]; then
            echo "prompt required"
            exit 1
          fi

      - name: Resolve GitHub token
        id: tok
        shell: bash
        env:
          AGENT_PAT: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${AGENT_PAT:-}" ]; then
            echo "token_source=AGENT_GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token_source=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate GitHub CLI and authentication
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git --version
          gh --version
          gh auth status
          gh api "repos/${{ github.event.inputs.target_repo }}" --jq '.full_name + " (" + .default_branch + ")"'

      - name: Report RUNNING
        if: ${{ github.event.inputs.callback_url != '' && github.event.inputs.callback_token != '' }}
        env:
          CALLBACK_TOKEN: ${{ github.event.inputs.callback_token }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        shell: bash
        run: |
          set -euo pipefail
                    curl --fail-with-body -sS -X PATCH "$CALLBACK_URL"             -H "Content-Type: application/json"             -H "x-worker-token: $CALLBACK_TOKEN"             -d '{"status":"RUNNING","workerRunId":"${{ github.run_id }}","heartbeatAt":"'$(date -u -Iseconds)'"}'

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          path: workspace
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --quiet aider-chat
          jq --version
          aider --version

      - name: Execute agent loop
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
          TASK_PROMPT: ${{ github.event.inputs.prompt }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Personal AI Bot task $TASK_ID ==="
          echo "Token source: ${{ steps.tok.outputs.token_source }}"
          git config user.name "Personal-AI-Bot"
          git config user.email "bot@users.noreply.github.com"

          BRANCH="agent/$TASK_ID"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            echo "Remote branch $BRANCH already exists; checking it out for a safe retry."
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "LLM_API_KEY is missing; cannot execute the coding agent."
            exit 1
          fi

          echo "LLM provider: Google Gemini API"
          MODEL="gemini/gemini-3.6-flash"
          echo "Aider model route: $MODEL"
          printf '%s' "$TASK_PROMPT" | aider --yes --no-git --model "$MODEL" --message-file /dev/stdin

          git add -A
          if git diff --cached --quiet; then
            echo "Agent completed but produced no changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git commit -m "agent($TASK_ID): automated changes"
          git push -u origin "$BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: pr
        if: steps.agent.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/$TASK_ID"
          set +e
          PR_URL=$(gh pr create             --base "$TARGET_BRANCH"             --head "$BRANCH"             --title "[Personal AI Bot] $TASK_ID"             --body "Automated coding task $TASK_ID" 2>&1)
          PR_EC=$?
          set -e

          if [ $PR_EC -ne 0 ] || [[ "$PR_URL" != https://* ]]; then
            echo "gh pr create failed (exit $PR_EC): $PR_URL"
            echo "If this says Actions cannot create PRs, enable: Settings -> Actions -> General -> Workflow permissions -> Allow GitHub Actions to create and approve pull requests"
            EXISTING=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' 2>/dev/null || true)
            if [ -n "$EXISTING" ] && [[ "$EXISTING" == https://* ]]; then
              PR_URL="$EXISTING"
              echo "Reusing existing PR: $PR_URL"
            else
              PR_URL=""
              echo "PR creation unavailable; branch and commit remain available."
            fi
          fi

          echo "pull-request-url=$PR_URL" >> "$GITHUB_OUTPUT"


      - name: Record execution steps
        if: always() && github.event.inputs.callback_url != '' && github.event.inputs.callback_token != ''
        env:
          CALLBACK_TOKEN: ${{ github.event.inputs.callback_token }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        shell: bash
        run: |
          set -euo pipefail
                    report() {
            curl -sS -X PATCH "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-worker-token: $CALLBACK_TOKEN" -d "$1" || true
          }
          report '{"step":{"name":"Runner provisioned","status":"COMPLETED","detail":"GitHub hosted runner started successfully."}}'
          report '{"step":{"name":"Validate inputs and authentication","status":"COMPLETED","detail":"Task inputs and GitHub access were validated."}}'
          report '{"step":{"name":"Checkout target repository","status":"COMPLETED","detail":"Requested repository and base branch were checked out."}}'
          report '{"step":{"name":"Install agent tooling","status":"COMPLETED","detail":"Python, aider-chat, and jq were installed and verified."}}'
          if [ "${{ steps.agent.outcome }}" = "success" ]; then
            report '{"step":{"name":"Execute coding agent","status":"COMPLETED","detail":"The coding agent completed its requested operation."}}'
          else
            report '{"step":{"name":"Execute coding agent","status":"FAILED","detail":"The coding agent failed. See the GitHub Actions run for the exact failure."}}'
          fi
          if [ "${{ steps.agent.outcome }}" = "success" ] && [ "${{ steps.agent.outputs.has_changes }}" = "true" ]; then
            report '{"step":{"name":"Commit and push changes","status":"COMPLETED","detail":"Agent changes were committed and pushed."}}'
            if [ -n "${{ steps.pr.outputs.pull-request-url }}" ]; then
              report '{"step":{"name":"Create Pull Request","status":"COMPLETED","detail":"Pull request created or reused."}}'
            else
              report '{"step":{"name":"Create Pull Request","status":"COMPLETED","detail":"No PR URL was available; branch and commit remain available."}}'
            fi
          fi
          if [ "${{ job.status }}" != "success" ]; then
            report '{"step":{"name":"Worker execution","status":"FAILED","detail":"One or more workflow steps failed. See the GitHub Actions run for the exact failure."}}'
          else
            report '{"step":{"name":"Worker execution","status":"COMPLETED","detail":"Workflow finished successfully."}}'
          fi

      - name: Report success / failure
        if: always() && github.event.inputs.callback_url != '' && github.event.inputs.callback_token != ''
        env:
          CALLBACK_TOKEN: ${{ github.event.inputs.callback_token }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        shell: bash
        run: |
          set -euo pipefail

          STATUS="FAILED"
          if [ "${{ job.status }}" = "success" ]; then
            if [ -n "${{ steps.pr.outputs.pull-request-url }}" ]; then
              STATUS="PR_CREATED"
            elif [ "${{ steps.agent.outputs.has_changes }}" = "true" ]; then
              STATUS="COMPLETED"
            else
              STATUS="COMPLETED"
            fi
          fi

          PAYLOAD=$(jq -n             --arg status "$STATUS"             --arg run "${{ github.run_id }}"             --arg commit "${{ steps.agent.outputs.commit }}"             --arg pr "${{ steps.pr.outputs.pull-request-url }}"             '{status:$status, workerRunId:$run, commitSha:$commit, prUrl:$pr}')

          curl --fail-with-body -sS -X PATCH "$CALLBACK_URL"             -H "Content-Type: application/json"             -H "x-worker-token: $CALLBACK_TOKEN"             -d "$PAYLOAD"

      - name: Cleanup workspace (ephemeral)
        if: always()
        shell: bash
        run: rm -rf workspace || true

