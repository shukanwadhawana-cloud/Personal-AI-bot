name: Coding Agent Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID from control plane
        required: true
        type: string
      target_repo:
        description: owner/repo to work on
        required: true
        type: string
      target_branch:
        description: Base branch
        required: false
        default: main
        type: string
      prompt:
        description: Natural language coding instruction
        required: true
        type: string
      callback_url:
        description: Full URL to PATCH (e.g. https://app/api/tasks/id)
        required: true
        type: string
      callback_token:
        description: Per-task callback credential
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  run-agent:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate inputs and runner
        env:
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          TASK_PROMPT: ${{ github.event.inputs.prompt }}
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OK"
          if [[ ! "$TARGET_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "Invalid repository format"; exit 1
          fi
          if [[ -z "$TASK_ID" || ! "$TASK_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid task_id"; exit 1
          fi
          if [[ -z "$TASK_PROMPT" ]]; then
            echo "prompt required"; exit 1
          fi

      - name: Resolve GitHub token
        id: tok
        shell: bash
        env:
          AGENT_PAT: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${AGENT_PAT:-}" ]; then
            echo "token_source=AGENT_GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token_source=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate GitHub CLI and authentication
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git --version
          gh --version
          gh auth status
          gh api "repos/${{ github.event.inputs.target_repo }}" --jq '.full_name + " (" + .default_branch + ")"'

      - name: Report RUNNING
        id: report_running
        env:
          CALLBACK_TOKEN: ${{ github.event.inputs.callback_token }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${WORKER_CALLBACK_SECRET:-}" ]; then
            echo "WARNING: WORKER_CALLBACK_SECRET is not set in Actions secrets. Callbacks need either that secret or a valid per-task lease token."
          fi
          URL="$CALLBACK_URL"
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then
            if [[ "$URL" == *\?* ]]; then URL="${URL}&x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"
            else URL="${URL}?x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"; fi
          fi
          ARGS=(-H "Content-Type: application/json" -H "x-worker-token: ${CALLBACK_TOKEN}")
          if [ -n "${WORKER_CALLBACK_SECRET:-}" ]; then ARGS+=(-H "x-worker-secret: ${WORKER_CALLBACK_SECRET}"); fi
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then ARGS+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}"); fi
          HTTP=$(curl -sS -o /tmp/cb_body.txt -w "%{http_code}" -X PATCH "$URL" "${ARGS[@]}" \
            -d "{\"status\":\"RUNNING\",\"workerRunId\":\"${{ github.run_id }}\",\"heartbeatAt\":\"$(date -u -Iseconds)\"}" || echo "000")
          echo "callback_http=$HTTP"
          head -c 400 /tmp/cb_body.txt || true; echo
          if [[ "$HTTP" =~ ^2 ]]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          path: workspace
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --quiet aider-chat
          jq --version
          aider --version

      - name: Execute agent loop
        id: agent
        env:
          GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}
          TASK_PROMPT: ${{ github.event.inputs.prompt }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          CALLBACK_TOKEN: ${{ github.event.inputs.callback_token }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Personal AI Bot task $TASK_ID ==="
          git config user.name "Personal-AI-Bot"
          git config user.email "bot@users.noreply.github.com"

          # Ensure dependency dirs are never committed
          if [ ! -f .gitignore ] || ! grep -qx 'node_modules/' .gitignore 2>/dev/null; then
            printf '\nnode_modules/\n.next/\ndist/\nbuild/\n.env\n.env.*\n' >> .gitignore
          fi

          BRANCH="agent/$TASK_ID"
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "LLM_API_KEY is missing"; exit 1
          fi

          MODEL="gemini/gemini-2.0-flash"
          echo "Aider model: $MODEL"

          callback_patch() {
            local payload="$1" url="$CALLBACK_URL"
            if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then
              if [[ "$url" == *\?* ]]; then url="${url}&x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"
              else url="${url}?x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"; fi
            fi
            local args=(-H "Content-Type: application/json" -H "x-worker-token: ${CALLBACK_TOKEN}")
            if [ -n "${WORKER_CALLBACK_SECRET:-}" ]; then args+=(-H "x-worker-secret: ${WORKER_CALLBACK_SECRET}"); fi
            if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then args+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}"); fi
            curl -sS -X PATCH "$url" "${args[@]}" -d "$payload" >/dev/null || true
          }

          report_step() {
            local step_id="$1" step_status="$2" step_name="$3" detail="$4" now
            now="$(date -u -Iseconds)"
            local payload
            payload=$(jq -n --arg id "$step_id" --arg name "$step_name" --arg status "$step_status" --arg now "$now" --arg detail "$detail" \
              '{step:{id:$id,name:$name,status:$status,startedAt:$now,completedAt:(if $status == "RUNNING" then null else $now end),detail:$detail}}')
            callback_patch "$payload"
          }

          report_step "agent-execution" "RUNNING" "Execute coding agent" "Aider implementing change."
          printf '%s' "$TASK_PROMPT" | aider --yes --no-git --model "$MODEL" --message-file /dev/stdin
          report_step "agent-execution" "COMPLETED" "Execute coding agent" "Aider finished."

          # Never stage dependencies
          rm -rf node_modules .next dist build 2>/dev/null || true
          git reset HEAD -- node_modules .next dist build 2>/dev/null || true

          git add -A
          # Extra safety: unstage if anything slipped through
          git reset HEAD -- node_modules .next 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No source changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git commit -m "agent($TASK_ID): automated changes"
          git push -u origin "$BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: pr
        if: steps.agent.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN != '' && secrets.AGENT_GITHUB_TOKEN || github.token }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/$TASK_ID"
          set +e
          PR_URL=$(gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" --title "[Personal AI Bot] $TASK_ID" --body "Automated coding task $TASK_ID" 2>&1)
          PR_EC=$?
          set -e
          if [ $PR_EC -ne 0 ] || [[ "$PR_URL" != https://* ]]; then
            EXISTING=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' 2>/dev/null || true)
            if [ -n "$EXISTING" ] && [[ "$EXISTING" == https://* ]]; then PR_URL="$EXISTING"; else PR_URL=""; fi
          fi
          echo "pull-request-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Report success / failure
        if: always()
        env:
          CALLBACK_TOKEN: ${{ github.event.inputs.callback_token }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        shell: bash
        run: |
          set -uo pipefail
          STATUS="FAILED"
          if [ "${{ job.status }}" = "success" ]; then
            if [ -n "${{ steps.pr.outputs.pull-request-url }}" ]; then STATUS="PR_CREATED"; else STATUS="COMPLETED"; fi
          fi
          PAYLOAD=$(jq -n --arg status "$STATUS" --arg run "${{ github.run_id }}" --arg commit "${{ steps.agent.outputs.commit }}" --arg pr "${{ steps.pr.outputs.pull-request-url }}" '{status:$status, workerRunId:$run, commitSha:$commit, prUrl:$pr}')
          URL="$CALLBACK_URL"
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then
            if [[ "$URL" == *\?* ]]; then URL="${URL}&x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"
            else URL="${URL}?x-vercel-protection-bypass=${VERCEL_BYPASS_SECRET}"; fi
          fi
          ARGS=(-H "Content-Type: application/json" -H "x-worker-token: ${CALLBACK_TOKEN}")
          if [ -n "${WORKER_CALLBACK_SECRET:-}" ]; then ARGS+=(-H "x-worker-secret: ${WORKER_CALLBACK_SECRET}"); fi
          if [ -n "${VERCEL_BYPASS_SECRET:-}" ]; then ARGS+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS_SECRET}"); fi
          HTTP=$(curl -sS -o /tmp/final_cb.txt -w "%{http_code}" -X PATCH "$URL" "${ARGS[@]}" -d "$PAYLOAD" || echo "000")
          echo "final_callback_http=$HTTP"
          head -c 300 /tmp/final_cb.txt || true; echo

      - name: Cleanup workspace (ephemeral)
        if: always()
        shell: bash
        run: rm -rf workspace || true
