name: Coding Agent Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID from control plane'
        required: true
      target_repo:
        description: 'owner/repo to work on'
        required: true
      target_branch:
        description: 'Base branch'
        required: false
        default: 'main'
      prompt:
        description: 'Natural language coding instruction'
        required: true
      callback_url:
        description: 'Full URL to PATCH (e.g. https://app/api/tasks/<id>)'
        required: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate inputs
        run: |
          if [[ ! "${{ github.event.inputs.target_repo }}" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "Invalid repository format"
            exit 1
          fi
          if [[ -z "${{ github.event.inputs.task_id }}" ]]; then
            echo "task_id required"
            exit 1
          fi
          # task_id must be a UUID-like token to keep branch names safe
          if [[ ! "${{ github.event.inputs.task_id }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid task_id characters"
            exit 1
          fi

      - name: Report RUNNING
        if: ${{ github.event.inputs.callback_url != '' }}
        env:
          WORKER_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          curl -sS -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -d "{\"status\":\"RUNNING\",\"workerRunId\":\"${{ github.run_id }}\",\"heartbeatAt\":\"$(date -u -Iseconds)\"}" || true

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: workspace
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent tooling
        run: |
          pip install --quiet aider-chat

      - name: Execute agent loop
        id: agent
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.LLM_BASE_URL }}
          AIDER_MODEL: ${{ secrets.LLM_MODEL }}
          # Prompt is passed via env to avoid shell-injection via expression interpolation
          TASK_PROMPT: ${{ github.event.inputs.prompt }}
          TASK_ID: ${{ github.event.inputs.task_id }}
        working-directory: workspace
        run: |
          set -euo pipefail
          echo "=== Personal AI Bot task $TASK_ID ==="

          git config user.name "Personal-AI-Bot"
          git config user.email "bot@users.noreply.github.com"
          BRANCH="agent/$TASK_ID"
          git checkout -b "$BRANCH"

          if [ -n "${OPENAI_API_KEY:-}" ]; then
            MODEL_FLAG=""
            if [ -n "${AIDER_MODEL:-}" ]; then
              MODEL_FLAG="--model $AIDER_MODEL"
            fi
            # Use printf + pipe so special characters in the prompt cannot break the shell
            printf '%s' "$TASK_PROMPT" | aider --yes --no-git $MODEL_FLAG --message-file /dev/stdin || echo "Aider exited non-zero (continuing)"
          else
            echo "No LLM_API_KEY — writing minimal safe placeholder for pipeline verification"
            echo "# Agent placeholder $(date -u -Iseconds)" >> AGENT_PLACEHOLDER.md
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "agent($TASK_ID): automated changes"
            git push -u origin "$BRANCH"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: pr
        if: steps.agent.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: workspace
          branch: agent/${{ github.event.inputs.task_id }}
          base: ${{ github.event.inputs.target_branch }}
          title: "[Personal AI Bot] ${{ github.event.inputs.task_id }}"
          body: |
            ## Automated coding task

            **Task ID:** `${{ github.event.inputs.task_id }}`

            Generated by the Personal AI Bot control plane. Review carefully before merging.
          draft: false

      - name: Report success / failure
        if: always() && github.event.inputs.callback_url != ''
        env:
          WORKER_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          STATUS="FAILED"
          if [ "${{ job.status }}" = "success" ]; then
            if [ "${{ steps.agent.outputs.has_changes }}" = "true" ]; then
              STATUS="PR_CREATED"
            else
              STATUS="COMPLETED"
            fi
          fi
          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg run "${{ github.run_id }}" \
            --arg commit "${{ steps.agent.outputs.commit }}" \
            --arg pr "${{ steps.pr.outputs.pull-request-url }}" \
            '{status:$status, workerRunId:$run, commitSha:$commit, prUrl:$pr}')
          curl -sS -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -d "$PAYLOAD" || true

      - name: Cleanup workspace (ephemeral)
        if: always()
        run: |
          rm -rf workspace || true
