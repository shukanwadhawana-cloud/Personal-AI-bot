name: Coding Agent Task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID from control plane'
        required: true
      target_repo:
        description: 'owner/repo to work on'
        required: true
      target_branch:
        description: 'Base branch'
        required: false
        default: 'main'
      prompt:
        description: 'Natural language coding instruction'
        required: true
      callback_url:
        description: 'Full URL to PATCH'
        required: false
        default: ''

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate inputs
        run: |
          echo "task_id=${{ github.event.inputs.task_id }}"
          echo "target_repo=${{ github.event.inputs.target_repo }}"
          if [[ ! "${{ github.event.inputs.target_repo }}" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "Invalid repository format"
            exit 1
          fi
          if [[ ! "${{ github.event.inputs.task_id }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid task_id characters"
            exit 1
          fi

      - name: Report RUNNING
        if: ${{ github.event.inputs.callback_url != '' }}
        env:
          WORKER_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          curl -sS -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -d "{\"status\":\"RUNNING\",\"workerRunId\":\"${{ github.run_id }}\",\"heartbeatAt\":\"$(date -u -Iseconds)\"}" || true

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          path: workspace
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent tooling
        run: |
          pip install --quiet aider-chat
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi

      - name: Execute agent loop
        id: agent
        env:
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.LLM_BASE_URL }}
          AIDER_MODEL: ${{ secrets.LLM_MODEL }}
          TASK_PROMPT: ${{ github.event.inputs.prompt }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
        working-directory: workspace
        run: |
          set -euo pipefail
          echo "=== Personal AI Bot task $TASK_ID ==="

          git config user.name "Personal-AI-Bot"
          git config user.email "bot@users.noreply.github.com"
          BRANCH="agent/$TASK_ID"
          git checkout -b "$BRANCH"

          if [ -n "${OPENAI_API_KEY:-}" ]; then
            AIDER_ARGS=(--yes --no-git --message-file /dev/stdin)
            if [ -n "${AIDER_MODEL:-}" ]; then
              AIDER_ARGS+=(--model "$AIDER_MODEL")
            fi
            printf '%s' "$TASK_PROMPT" | aider "${AIDER_ARGS[@]}" || echo "Aider exited non-zero (continuing)"
          else
            echo "No LLM_API_KEY — writing diagnostic file for pipeline verification"
            mkdir -p diagnostics
            echo "coding agent executed successfully $(date -u -Iseconds)" > diagnostics/CODING_AGENT_E2E.md
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "agent($TASK_ID): automated changes"
            git push -u origin "$BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: pr
        if: steps.agent.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        working-directory: workspace
        run: |
          set -euo pipefail
          BRANCH="agent/$TASK_ID"
          PR_URL=$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --title "[Personal AI Bot] $TASK_ID" \
            --body "Automated coding task $TASK_ID" \
            || true)
          if [ -z "${PR_URL:-}" ]; then
            PR_URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' || true)
          fi
          echo "pull-request-url=${PR_URL:-}" >> "$GITHUB_OUTPUT"
          echo "PR: ${PR_URL:-none}"

      - name: Report success / failure
        if: always() && github.event.inputs.callback_url != ''
        env:
          WORKER_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          STATUS="FAILED"
          if [ "${{ job.status }}" = "success" ]; then
            if [ "${{ steps.agent.outputs.has_changes }}" = "true" ]; then
              STATUS="PR_CREATED"
            else
              STATUS="COMPLETED"
            fi
          fi
          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg run "${{ github.run_id }}" \
            --arg commit "${{ steps.agent.outputs.commit }}" \
            --arg pr "${{ steps.pr.outputs.pull-request-url }}" \
            '{status:$status, workerRunId:$run, commitSha:$commit, prUrl:$pr}')
          curl -sS -X PATCH "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -d "$PAYLOAD" || true

      - name: Cleanup workspace
        if: always()
        run: rm -rf workspace || true
